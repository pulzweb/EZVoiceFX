name: Build EZ Voice FX

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: deps/JUCE

      - name: Download RNNoise
        uses: actions/checkout@v4
        with:
          repository: werman/noise-suppression-for-voice
          path: deps/nsv
          sparse-checkout: external/rnnoise

      - name: Configure
        shell: pwsh
        run: |
          $root = (Get-Location).Path -replace '\\','/'
          $src = "."
          if (-not (Test-Path "CMakeLists.txt") -and (Test-Path "EZVoiceFX/CMakeLists.txt")) { $src = "EZVoiceFX" }
          "SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append
          cmake -S $src -B build -A x64 "-DEZ_JUCE_DIR=$root/deps/JUCE" "-DEZ_RNNOISE_DIR=$root/deps/nsv/external/rnnoise"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse "build/EZVoiceFX_artefacts/Release/VST3/EZ Voice FX.vst3" "dist/"
          Copy-Item "build/EZVoiceFX_artefacts/Release/Standalone/EZ Voice FX.exe" "dist/" -ErrorAction SilentlyContinue
          Copy-Item "$env:SRC/README.md" "dist/" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: EZ-Voice-FX-Windows-VST3
          path: dist
